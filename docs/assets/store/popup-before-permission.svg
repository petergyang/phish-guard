<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Phish Guard popup before Gmail permission</title>
  <desc id="desc">A Chrome extension popup explaining Gmail sender warnings before the user enables Gmail access.</desc>
  <rect width="1280" height="800" fill="#eef2f7"/>
  <rect x="406" y="92" width="472" height="584" rx="24" fill="#ffffff" stroke="#d8dee9"/>
  <rect x="438" y="126" width="64" height="64" rx="16" fill="#155EEF"/>
  <path d="M470 138L492 146V162C492 177 483 189 470 195C457 189 448 177 448 162V146L470 138Z" fill="#ffffff"/>
  <path d="M470 147L484 152V164C484 174 478 183 470 188C462 183 456 174 456 164V152L470 147Z" fill="#FEF7E0"/>
  <path d="M470 156L481 176H459L470 156Z" fill="#D93025"/>
  <rect x="468" y="165" width="4" height="10" rx="2" fill="#ffffff"/>
  <circle cx="470" cy="179" r="2" fill="#ffffff"/>
  <text x="526" y="154" fill="#111827" font-family="Arial, sans-serif" font-size="30" font-weight="800">Phish Guard</text>
  <text x="526" y="186" fill="#4b5563" font-family="Arial, sans-serif" font-size="18">Gmail sender warnings</text>
  <text x="438" y="254" fill="#111827" font-family="Arial, sans-serif" font-size="26" font-weight="800">Spot suspicious messages</text>
  <text x="438" y="294" fill="#374151" font-family="Arial, sans-serif" font-size="20">Checks the open Gmail message locally.</text>
  <text x="438" y="324" fill="#374151" font-family="Arial, sans-serif" font-size="20">Warns when it may be pretending to be a brand.</text>
  <rect x="438" y="350" width="408" height="92" rx="14" fill="#f8fafc" stroke="#d8dee9"/>
  <text x="468" y="386" fill="#111827" font-family="Arial, sans-serif" font-size="19" font-weight="700">Private by default</text>
  <text x="468" y="416" fill="#4b5563" font-family="Arial, sans-serif" font-size="18">No attachments, inbox history,</text>
  <text x="468" y="438" fill="#4b5563" font-family="Arial, sans-serif" font-size="18">or email upload.</text>
  <rect x="438" y="486" width="408" height="54" rx="12" fill="#155EEF"/>
  <text x="578" y="521" fill="#ffffff" font-family="Arial, sans-serif" font-size="19" font-weight="800">Turn on Gmail warnings</text>
  <text x="438" y="586" fill="#6b7280" font-family="Arial, sans-serif" font-size="16">Chrome will ask for Gmail access so Phish Guard</text>
  <text x="438" y="610" fill="#6b7280" font-family="Arial, sans-serif" font-size="16">can add warnings inside Gmail.</text>
</svg>
