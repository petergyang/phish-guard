<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Normal Gmail message with no Phish Guard warning</title>
  <desc id="desc">A Gmail-like message view from a normal sender with no warning banner.</desc>
  <rect width="1280" height="720" fill="#f6f8fb"/>
  <rect x="56" y="48" width="1168" height="624" rx="24" fill="#ffffff" stroke="#d9dee8"/>
  <rect x="56" y="48" width="1168" height="72" rx="24" fill="#111827"/>
  <rect x="56" y="96" width="1168" height="24" fill="#111827"/>
  <circle cx="104" cy="84" r="14" fill="#ef4444"/>
  <circle cx="144" cy="84" r="14" fill="#f59e0b"/>
  <circle cx="184" cy="84" r="14" fill="#22c55e"/>
  <text x="236" y="92" fill="#f9fafb" font-family="Arial, sans-serif" font-size="28" font-weight="700">Gmail</text>
  <rect x="384" y="66" width="424" height="36" rx="18" fill="#374151"/>
  <text x="416" y="91" fill="#d1d5db" font-family="Arial, sans-serif" font-size="18">Search mail</text>
  <text x="136" y="184" fill="#111827" font-family="Arial, sans-serif" font-size="34" font-weight="500">Your YouTube channel looks great</text>
  <circle cx="166" cy="286" r="34" fill="#2563eb"/>
  <text x="154" y="298" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">A</text>
  <text x="224" y="268" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="700">Alex Chen &lt;alex@example.com&gt;</text>
  <text x="224" y="300" fill="#6b7280" font-family="Arial, sans-serif" font-size="18">to me</text>
  <text x="1016" y="268" fill="#6b7280" font-family="Arial, sans-serif" font-size="18">Today, 10:12 AM</text>
  <rect x="224" y="384" width="832" height="168" rx="16" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="280" y="450" fill="#111827" font-family="Arial, sans-serif" font-size="26" font-weight="700">Nice work on the latest video.</text>
  <text x="280" y="498" fill="#374151" font-family="Arial, sans-serif" font-size="22">Your YouTube breakdown was clear and useful. No warning appears because this is a person, not a sender claiming to be YouTube.</text>
</svg>
