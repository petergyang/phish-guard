<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Phish Guard warning inside Gmail</title>
  <desc id="desc">A Gmail-like message view with a Phish Guard warning above a suspicious sender row.</desc>
  <rect width="1280" height="720" fill="#f6f8fb"/>
  <rect x="56" y="48" width="1168" height="624" rx="24" fill="#ffffff" stroke="#d9dee8"/>
  <rect x="56" y="48" width="1168" height="72" rx="24" fill="#111827"/>
  <rect x="56" y="96" width="1168" height="24" fill="#111827"/>
  <circle cx="104" cy="84" r="14" fill="#ef4444"/>
  <circle cx="144" cy="84" r="14" fill="#f59e0b"/>
  <circle cx="184" cy="84" r="14" fill="#22c55e"/>
  <text x="236" y="92" fill="#f9fafb" font-family="Arial, sans-serif" font-size="28" font-weight="700">Gmail</text>
  <rect x="384" y="66" width="424" height="36" rx="18" fill="#374151"/>
  <text x="416" y="91" fill="#d1d5db" font-family="Arial, sans-serif" font-size="18">Search mail</text>

  <text x="136" y="178" fill="#111827" font-family="Arial, sans-serif" font-size="34" font-weight="500">Costco Rewards Marketplace</text>
  <rect x="580" y="151" width="78" height="36" rx="8" fill="#e5e7eb"/>
  <text x="600" y="175" fill="#4b5563" font-family="Arial, sans-serif" font-size="18" font-weight="700">Spam</text>

  <rect x="136" y="204" width="1008" height="98" rx="10" fill="#fff7df" stroke="#f5b83d" stroke-width="2"/>
  <rect x="136" y="204" width="8" height="98" rx="4" fill="#f5b83d"/>
  <circle cx="184" cy="253" r="26" fill="#dc2626"/>
  <text x="176" y="263" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">!</text>
  <text x="230" y="244" fill="#1f2937" font-family="Arial, sans-serif" font-size="24" font-weight="700">Phish Guard warning: This is likely not from Costco.</text>
  <text x="230" y="277" fill="#374151" font-family="Arial, sans-serif" font-size="20">Sender email: timmierod9winyu5@hotmail.com. Avoid links. Use Gmail's Report spam button or delete the email.</text>

  <circle cx="166" cy="372" r="34" fill="#6b7280"/>
  <text x="154" y="385" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">!</text>
  <text x="224" y="354" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="700">Costco Membership Perks Program &lt;timmierod9winyu5@hotmail.com&gt;</text>
  <text x="224" y="386" fill="#6b7280" font-family="Arial, sans-serif" font-size="18">to me</text>
  <text x="1016" y="354" fill="#6b7280" font-family="Arial, sans-serif" font-size="18">Sun, May 31, 3:10 PM</text>

  <rect x="224" y="448" width="832" height="136" rx="16" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="480" y="520" fill="#dc2626" font-family="Arial, sans-serif" font-size="50" font-weight="800">COSTCO</text>
  <text x="512" y="560" fill="#2563eb" font-family="Arial, sans-serif" font-size="24" font-weight="800">WHOLESALE</text>
</svg>
